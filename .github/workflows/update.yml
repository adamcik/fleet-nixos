name: Check Fleet Orbit updater

on:
  schedule:
    - cron: "42 4 * * *" # 04:42 UTC (approx 05:42/06:42 Oslo time)

  workflow_dispatch:
    inputs:
      version:
        description: "Exact Orbit version to verify; leave empty for latest stable"
        type: string
        required: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    environment: Update

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Set up Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: fleet-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run update script
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          ORBIT_VERSION: ${{ inputs.version }}
        run:
          |
          if [[ -n "$ORBIT_VERSION" ]]; then
            ./update.sh --version "$ORBIT_VERSION"
          else
            ./update.sh
          fi

      - name: Send successful run pulse
        if: ${{ github.event_name == 'schedule' }}
        env:
          UPDOWN_PULSE_URL: ${{ secrets.UPDOWN_PULSE_URL }}
        run: curl --fail --silent --show-error --max-time 10 --retry 5 "$UPDOWN_PULSE_URL"
