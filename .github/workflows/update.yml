name: Update Fleet Orbit

on:
  schedule:
    - cron: "42 4 * * *" # 04:42 UTC (approx 05:42/06:42 Oslo time)

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: Update

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Set up Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: fleet-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run update script
        id: update
        run: ./update.sh

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.UPDATE_PAT }}
          commit-message: "Update Fleet Orbit"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          title: "Update Fleet Orbit to v${{ steps.update.outputs.version }}"
          body: |
            Automated update of Fleet Orbit to v${{ steps.update.outputs.version }}.

            - Source revision: `${{ steps.update.outputs.commit }}`
            - Release date: `${{ steps.update.outputs.date }}`
            - Updates the Orbit package definition in `pkgs/default.nix`.

            Generated by `.github/workflows/update.yml`.
          branch: "automation/update-fleet"
          labels: "dependencies"

      - name: Send successful run pulse
        if: ${{ github.event_name == 'schedule' }}
        env:
          UPDOWN_PULSE_URL: ${{ secrets.UPDOWN_PULSE_URL }}
        run: curl --fail --silent --show-error --max-time 10 --retry 5 "$UPDOWN_PULSE_URL"
